<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Sorteador de irmãos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--p:#6d28d9;--p-dark:#4c1d95;--p-soft:#f5f0ff;--p-line:#e4d9f8;--ink:#1f1536;--mute:#6b6283;--bg:#faf8ff;--white:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{background:var(--white);border-bottom:1px solid var(--p-line)}
.bar{max-width:560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--p);display:grid;place-items:center;flex:none}
.bar b{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.bar span{display:block;font-size:.8rem;color:var(--mute);font-weight:500}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:28px 20px 40px}
.steps{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.st{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--mute)}
.st i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:var(--white);border:2px solid var(--p-line);color:var(--mute)}
.st.on{color:var(--p-dark)}
.st.on i{background:var(--p);border-color:var(--p);color:#fff}
.st.done i{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.ln{flex:1;height:2px;background:var(--p-line);border-radius:2px}
.card{background:var(--white);border:1px solid var(--p-line);border-radius:20px;padding:28px 22px;box-shadow:0 10px 30px -12px rgba(76,29,149,.25)}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.sub{margin:0 0 22px;color:var(--mute);line-height:1.55}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:72px;padding:16px;border-radius:16px;border:2px solid var(--p-line);background:var(--white);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--p);background:var(--p-soft)}
.opt strong{display:block;font-size:1.02rem}
.opt small{color:var(--mute);font-size:.86rem}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:800;flex:none}
.opt .ar{margin-left:auto;color:var(--p)}
.res{text-align:center;padding:6px 0 4px}
.av{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,var(--p-dark));color:#fff;display:grid;place-items:center;font-size:1.9rem;font-weight:800;letter-spacing:.02em}
.lab{font-size:.88rem;color:var(--mute);font-weight:600;margin-bottom:6px}
.nome{font-size:clamp(1.7rem,8vw,2.2rem);font-weight:800;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere;margin:0 0 6px}
.badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:var(--p-soft);color:var(--p-dark);font-size:.8rem;font-weight:700}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.q{margin:26px 0 14px;padding-top:22px;border-top:1px solid var(--p-line);font-weight:700;text-align:center}
.row{display:grid;gap:10px}
@media(min-width:420px){.row.two{grid-template-columns:1fr 1fr}}
.btn{font:inherit;font-weight:700;min-height:50px;padding:12px 18px;border-radius:14px;border:2px solid var(--p);background:var(--white);color:var(--p);cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--p-soft)}
.btn.fill{background:var(--p);color:#fff}
.btn.fill:hover{background:var(--p-dark);border-color:var(--p-dark)}
.btn:active,.opt:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #b79cf2;outline-offset:2px}
.lock{text-align:center}.lock form{text-align:left}
.lbl{display:block;font-size:.88rem;font-weight:700;margin-bottom:6px}
.pwrow{display:flex;border:2px solid var(--p-line);border-radius:14px;background:var(--white);overflow:hidden}
.pwrow:focus-within{border-color:var(--p);box-shadow:0 0 0 3px #e4d9f8}
.pwrow input{flex:1;min-width:0;min-height:50px;border:0;outline:0;padding:0 14px;font:inherit;font-size:1rem;color:var(--ink);background:transparent}
.tg{border:0;background:transparent;color:var(--p);font:inherit;font-weight:700;font-size:.88rem;padding:0 16px;cursor:pointer}
.err{min-height:1.4em;margin:10px 0 12px;color:#b42318;font-size:.9rem;font-weight:600}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:0 20px 24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="#fff"/><circle cx="15.5" cy="15.5" r="1" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#fff"/></svg></div>
  <div><b>Sorteador de irmãos</b><span>Escolha rápida e justa</span></div>
</div></header>
<main>
  <nav class="steps" id="steps" aria-label="Progresso"></nav>
  <section class="card" id="app" aria-live="polite"></section>
</main>
<footer>Sorteio aleatório feito no seu navegador</footer>
<script>
(function(){
  var clean=function(a){return a.map(function(n){return n.replace(/\s+/g," ").trim();});};
  var BLOB="3A8BWAqatVVvXxHsTzsyhq+Db+1KoyGsdKM4aYzDY5dPlteNtP/k5Tl+1erhQYm3S8dtpNfcYiM10LoEgYXiu/xo4vxkcXxp17FG55RjbALtGRz+YhlvAv75UTqpl+GEdZYCDI70u1rIepeIr8d4x2eOj8Izk3q7W90gH+p+uOLCM6pO07YaCIYt1eWrN9juUWLmiFrFMNUZyIN3bTMDf02j+Z39wv6BejSQoGyCinLi7ketEa/qe2fSdeHvfSvYNOocLq04VxmTbDVtcVMlpXH9nXxRjjRoahtRysP2owmnPt5mLMsfTQxsgPbkslXXjWQwLnzF3kUEah17hT84zQnu1C+i3g0iYNhFduwpMO11HxOecCK5bOQWuRvDvnZ/ymuM7B7d2jgVS4wogHpfrocTVxz+ZfMYkKjb+kGBvoJ983hbqHL0K/d0ocYh4WSqeJY+V9gCE93YrCQEc0Lpt7o4dYraEzngajY4Piky8i+wAXY30+DBStNiBuyXZ/NxcayVeF0cb5Cj1c1sBtQ9VbTe2K+C8Du94KZaUFIDD2pkKBpC8o1ai5DehiM3CbjhYLfRvMTaFzcUu/kalvzVsiZQNFArRZp3qpeXEopmZ7jBMXQpFq7laimcA17C4WpeG7vllHecRB+vIXFlC7PvIaA4BPo67uaaKaFdD4gokFkAkMfaPUQ6TaoE7nlQ3ONYi/Y1aLWFvIJ8S9LHQbM7G2+dyqJwoBGoxyC3W2bVHqcpJQqq3S/euCDoJooC6hOqYp9SHcb5j8oTakD34Y9ZchbQCt2bK55G5b3ne1gtO/kvezv8p1usvvU5oFrj7rh/4qOERobgFDqI/HTfi3j9c2DTVWl7FqiZi/eToMRnDCLl5jDllwTjuA/kHVYGQ949Obwz4LE4l22wSm2rLl+jOYPaHs30UGZ/WYHRUj8grg0JlTyjG2Fmng+6HJNg27xwG7BSQjuZu+/Pd9d6HUH5lEV93MPrlblzx398vFdQcOajF/MbjQN3fv2v+UtONC0vOiIiC/SqEyVftjxtvGTTN5PUGGbSvYnfWCX5NA++RtGNJixRR2EvypKbIFdlFDwRQSlv3Ra+lqAl6tQc9Fac3uAxWlwUmNGpGAvUh+kra56KtuHv7gjVJ/1FHU5GslDlNVmlSU3/jSyU3pZVaRP8PPDuJ54bKL7d7chfhw/eeOqHsiE53RWxEvsDbGpycqkGkFDbwfEdijOMzZl1x2Rmdb5W+SS/F4ttad7hLLnMxJgtKLMGhUdcgLwuNAYdVEMkEPUBA+ZnEp0WNwDHslohdTb3KueqhzGwXjcVtmTQBbQ3yA9ONc974DX9KGgjKHdpAKVmUObl9iN+Q+Fa0EUAq5YwFoSnv5kwqBDNFKNqDRP12VN9tWjVRoQPLhEHyMcwwnIFctn4ZHsscJfIj9923EJ1U9ngjB+2wcPOUpqk0tCSy8nc09ZAgPWn2Y4GAtHapt74nGkyJ9L0ZbBG9wGgGCSzy62UhDj8IxDWnBCXt1ha2EoSMFUHdqaPn7qVXhJQYHw3WgG8MYEU4ymi2uzVaOukS3+HbUWrKECV2C8nSKyLsGQGQVP7pvjJwV5lieylSv5jBZFozjEFKVG9gguLmZqyLkoy4oBZ5QySx6E048n1DNq9NMIK46hip8PRHn0hLjFeCE61cGwsGdHh5tXcd3wHweAD6DobbbqqcytbwAGu0N3Hyqh1yW1xa8bFzvye3vrejFuEc+OVekv0zrWKf2DNwRCrF69pFgbA2wUVXKqqtjjR0RBQ7Aqk5xrrTZkvNKfbSnGAOJVkJZyCwUTHK6J8DFEhKqnbV8XmTF/r53YY5nfsWjqmmHtcMJgaSKrVttshk8u22PjWkJMr9SsWtvkDROO394qmZhr4TpGnVEoBgswEDTm6PTcOsNdCZU8ZrG6ugv5VVUi+R0Aq/Gi5SwFfrn7UseDxsg==";
  var LISTAS=null;
  async function abrir(pw){
    var raw=Uint8Array.from(atob(BLOB),function(ch){return ch.charCodeAt(0);});
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},k,raw.slice(28));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  function login(){
    stepsEl.innerHTML="";
    app.innerHTML='<div class="lock pop"><div class="av" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><h1>Acesso restrito</h1><p class="sub">Digite a senha para entrar no sorteador.</p><form id="lf" novalidate><label for="pw" class="lbl">Senha</label><div class="pwrow"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="tg" id="tg" aria-label="Mostrar senha">Mostrar</button></div><p class="err" id="err" role="alert"></p><button class="btn fill" type="submit" id="go" style="width:100%">Entrar</button></form></div>';
    var f=document.getElementById("lf"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go"),tg=document.getElementById("tg");
    pw.focus();
    tg.addEventListener("click",function(){var v=pw.type==="password";pw.type=v?"text":"password";tg.textContent=v?"Ocultar":"Mostrar";tg.setAttribute("aria-label",v?"Ocultar senha":"Mostrar senha");});
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      if(!pw.value){err.textContent="Digite a senha.";pw.focus();return;}
      if(!window.crypto||!crypto.subtle){err.textContent="Abra o site por uma conexão segura (HTTPS).";return;}
      err.textContent="";go.disabled=true;go.textContent="Verificando…";
      abrir(pw.value).then(function(l){LISTAS=l;inicio();}).catch(function(){
        err.textContent="Senha incorreta. Tente novamente.";pw.value="";pw.focus();go.disabled=false;go.textContent="Entrar";
      });
    });
  }
  var NOMES={plus:"Irmão plus",notplus:"Irmão not plus"};
  var app=document.getElementById("app"),stepsEl=document.getElementById("steps");
  var lista=null,tipo="",atual="";

  function sortear(){var n;do{n=lista[Math.floor(Math.random()*lista.length)];}while(n===atual&&lista.length>1);atual=n;}
  function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function ini(s){var p=s.split(" ");return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase();}
  function steps(n){
    var l=["Grupo","Sorteio","Resultado"],h="";
    l.forEach(function(t,i){
      var c=i+1===n?"on":(i+1<n?"done":"");
      h+='<div class="st '+c+'"'+(i+1===n?' aria-current="step"':'')+'><i>'+(i+1<n?"✓":i+1)+'</i>'+t+'</div>'+(i<2?'<div class="ln"></div>':'');
    });
    stepsEl.innerHTML=h;
  }
  function view(html,n){steps(n);app.innerHTML=html;var b=app.querySelector("button");if(b)b.focus({preventScroll:true});}
  function pessoa(){
    return '<div class="res pop"><div class="av" aria-hidden="true">'+esc(ini(atual))+'</div><div class="lab">Irmão(a) escolhido</div><p class="nome">'+esc(atual)+'</p><span class="badge">'+NOMES[tipo]+'</span></div>';
  }
  function inicio(){
    view('<h1>Quem você quer sortear?</h1><p class="sub">Escolha o grupo para sortear um nome aleatório.</p>'+
      '<div class="opts"><button class="opt" data-a="escolher" data-t="plus"><span class="ic">+</span><span><strong>Irmão plus</strong><small>'+LISTAS.plus.length+' nomes</small></span><span class="ar">›</span></button>'+
      '<button class="opt" data-a="escolher" data-t="notplus"><span class="ic">○</span><span><strong>Irmão not plus</strong><small>'+LISTAS.notplus.length+' nomes</small></span><span class="ar">›</span></button></div>',1);
  }
  function mostrar(){
    view(pessoa()+'<p class="q">Deseja mudar de irmão(a)?</p><div class="row two"><button class="btn" data-a="outro">Sim, sortear outro</button><button class="btn fill" data-a="manter">Não, manter este</button></div>',2);
  }
  function recente(){
    view(pessoa()+'<p class="q">Esse irmão fez parte recentemente?</p><div class="row two"><button class="btn" data-a="outro">Sim, sortear outro</button><button class="btn fill" data-a="final">Não</button></div>',2);
  }
  function final(){
    view(pessoa()+'<div class="row" style="margin-top:26px"><button class="btn fill" data-a="inicio">Novo sorteio</button></div>',3);
  }
  app.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-a");
    if(a==="escolher"){tipo=b.getAttribute("data-t");lista=LISTAS[tipo];atual="";sortear();mostrar();}
    else if(a==="outro"){sortear();mostrar();}
    else if(a==="manter"){recente();}
    else if(a==="final"){final();}
    else if(a==="inicio"){inicio();}
  });
  login();
})();
</script>
</body>
</html>
